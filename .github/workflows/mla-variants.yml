name: MLA cache variants
# benchmarks/mla_variants.h holds four ways to run one MLA layer's cached attention;
# docs/notes/mla-variants.md has the study. This workflow re-proves the exact variants
# bit for bit against the engine and records timings and the absorbed variant's
# numerics on both ISAs the project ships for. The macOS leg is the only Apple Silicon
# timing the study has: x86 ratios do not transfer (different memory system, NEON bf16
# kernel, three cores on the hosted runner), so that leg's JSON is the evidence, not
# an extrapolation.
on:
  pull_request:
    paths:
      - '.github/workflows/mla-variants.yml'
      - 'benchmarks/mla_variants.h'
      - 'benchmarks/bench_mla.c'
      - 'benchmarks/mla-study.sh'
      - 'tests/unit/test_mla_variants.c'
      - 'src/core/k3_ops.c'
      - 'include/k3/k3.h'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    name: MLA variants (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew install libomp; fi
          cc --version
      # -march=native is wrong for a hosted runner; x86 pins the documented AVX2+FMA
      # baseline as the main CI does. arm64 keeps the Makefile's platform detection,
      # which is the path a Mac user takes.
      - name: Build
        run: |
          if [ "$(uname -m)" = x86_64 ]; then
            make -j2 ARCH="-mavx2 -mfma" bin/test_mla_variants bin/bench_mla
          else
            make -j2 bin/test_mla_variants bin/bench_mla
          fi
      - name: E+, L0 and L1 bitwise against the engine; A against its scalar formula
        run: |
          ./bin/test_mla_variants | tee test.log
          grep -q "MLA VARIANTS: L1 AND E+ BITWISE IDENTICAL" test.log
      # Counted by running each variant, and a failure if any count leaves its closed
      # form. The prefill shape is where L0's count is quadratic in T and L1's linear.
      - name: kv_b application counts (prefill and decode shapes)
        run: |
          ./bin/bench_mla counts --C 0 --T 1,16,64,256 --json "mla-${{ runner.arch }}.jsonl"
          ./bin/bench_mla counts --C 256,1024,4096,16384 --T 1,5 \
            --json "mla-${{ runner.arch }}.jsonl"
      - name: Absorbed variant numerics (1,024 cached positions, 10,000 softmax rows)
        run: ./bin/bench_mla numerics --C 1024 --queries 105 --json "mla-${{ runner.arch }}.jsonl"
      # Hosted runners are shared too; --quiet-wait 0 records contention (Linux PSI)
      # without waiting for it. Runs longer than 20 s are projected, and say so.
      - name: Timing, one thread
        run: |
          ./bin/bench_mla --threads 1 --C 256,1024,4096 --T 1,5 --max-run-s 20 \
            --quiet-wait 0 --json "mla-${{ runner.arch }}.jsonl"
      - name: Timing, every core
        run: |
          ./bin/bench_mla --threads "$(getconf _NPROCESSORS_ONLN)" --C 256,1024,4096,16384 \
            --T 1,5 --max-run-s 20 --quiet-wait 0 --common --json "mla-${{ runner.arch }}.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mla-variants-${{ runner.os }}-${{ runner.arch }}
          path: |
            mla-*.jsonl
            test.log
