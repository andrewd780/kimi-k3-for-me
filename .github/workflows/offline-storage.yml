name: Offline storage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, a push to a busy PR should not queue builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  native:
    name: Native offline storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libzstd-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install zstd libomp
          echo "ZSTD_CFLAGS=-I$(brew --prefix zstd)/include" >> "$GITHUB_ENV"
          echo "ZSTD_LIBS=-L$(brew --prefix zstd)/lib -lzstd" >> "$GITHUB_ENV"
          echo "TEST_OMP_FLAGS=-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include -L$(brew --prefix libomp)/lib -lomp" >> "$GITHUB_ENV"
      - name: Compile and check native ranges, corruption, concurrency and byte parity
        run: python3 -m unittest discover -s tests -p test_offline_storage.py -v
      - name: Check selective ranges under address and undefined-behavior sanitizers
        if: runner.os == 'Linux'
        env:
          K3_TEST_NATIVE_CFLAGS: '-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie'
        run: python3 -m unittest discover -s tests -p test_offline_storage.py -k selective -v
      - name: Verify streaming equations and reproduce the deterministic scenario
        run: |
          python3 -m unittest discover -s tests -p test_streaming_bounds.py -v
          python3 tools/streaming_bounds.py --out streaming-bounds.json
          cmp docs/measurements/streaming-bounds.json streaming-bounds.json
      - name: Check quality window coverage and aggregation (no model evaluation)
        run: python3 -m unittest discover -s tests -p test_quality.py -v
      - name: Check held-out expert profile replay and trace validation
        run: python3 -m unittest discover -s tests -p test_expert_profile.py -v
      - name: Reproduce the single deterministic replay result per arm
        run: |
          python3 tools/expert_profile.py evaluate tests/fixtures/expert_trace.bin --layout legacy-prefixes --train-requests 7360 --out expert-profile-replay.json
          cmp docs/measurements/expert-profile-replay.json expert-profile-replay.json
      - name: Build compressed engine and run existing C tests
        run: make ZSTD=1 BUILD=build/zstd BIN=bin/zstd -j4 all test
      - name: Check CMake compressed build
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/cmake-zstd -DK3_ZSTD=ON
          cmake --build build/cmake-zstd -j4
          ctest --test-dir build/cmake-zstd --output-on-failure
      - name: Install synthetic model generator dependencies
        if: runner.os == 'Linux'
        run: pip install numpy==2.3.5 torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check actual generation, compressed trunk, reread and saved sessions
        if: runner.os == 'Linux'
        env:
          K3_TEST_BIN: bin/zstd/k3
          K3_PROFILE_REPORT: expert-profile-tiny-ci.json
          K3_CGROUP_TEST: '1'
          K3_HEAD_REPORT: lm-head-mechanism.json
        run: python3 -m unittest discover -s tests -p test_offline_cli.py -v
      - name: Preserve CI fixture measurements
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: expert-profile-ci
          path: |
            expert-profile-replay.json
            expert-profile-tiny-ci.json
            lm-head-mechanism.json

  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y libzstd-dev
      - name: Measure exact round trips on stratified K3 samples
        run: python3 tools/bench_lossless.py --out lossless-samples.json
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-samples
          path: lossless-samples.json
